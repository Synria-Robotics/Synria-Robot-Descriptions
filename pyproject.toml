[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synriard"
version = "1.0.0"
description = "URDF and MJCF robot description files for Synria robotic platforms."
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Synria Robotics", email = "support@synriarobotics.ai"}
]
keywords = ["robotics", "urdf", "mjcf", "robot-description"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
    "coacd",
    "trimesh",
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/Synria-robot-descriptions"

[tool.setuptools]
packages = {find = {}}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
synriard = [
    "urdf/**/*",
    "meshes/**/*",
    "mjcf/**/*",
]

