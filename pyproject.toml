[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synriard"
version = "1.2.4"
description = "URDF and MJCF robot description files for Synria robotic platforms."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Synria Robotics", email = "support@synriarobotics.ai"}
]
keywords = ["robotics", "urdf", "mjcf", "robot-description"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "coacd",
    "trimesh",
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/Synria-robot-descriptions"

[tool.setuptools]
# Only publish the Python packages for models that are included in the artifact.
include-package-data = false

[tool.setuptools.packages.find]
include = [
    "synriard",
    "synriard.urdf",
    "synriard.urdf.Alicia_D_v5_6",
    "synriard.urdf.Alicia_D_v6_1_2",
    "synriard.urdf.Alicia_M_v1_1",
    "synriard.urdf.Alicia_M_v1_2",
    "synriard.mjcf",
    "synriard.mjcf.Alicia_D_v5_6",
    "synriard.mjcf.Alicia_M_v1_1",
    "synriard.mjcf.Alicia_M_v1_2",
]

[tool.setuptools.package-data]
# Keep PyPI artifacts under the project size limit by shipping active Alicia models only.
# Older Alicia_M_v1_0 and large Bessica_D/Bessica_M assets remain in the repository,
# but are intentionally not included in wheels/sdists.
synriard = [
    "urdf/Alicia_D_v5_5/**/*",
    "meshes/Alicia_D_v5_5/**/*",
    "meshes/Alicia_D_v5_6/**/*",
    "meshes/Alicia_D_v6_1_2/**/*",
    "meshes/Alicia_M_v1_1/**/*",
    "meshes/Alicia_M_v1_2/**/*",
]
"synriard.urdf.Alicia_D_v5_6" = ["*.urdf"]
"synriard.urdf.Alicia_D_v6_1_2" = ["*.urdf"]
"synriard.urdf.Alicia_M_v1_1" = ["*.urdf"]
"synriard.urdf.Alicia_M_v1_2" = ["*.urdf"]
"synriard.mjcf.Alicia_D_v5_6" = ["*.xml"]
"synriard.mjcf.Alicia_M_v1_1" = ["*.xml"]
"synriard.mjcf.Alicia_M_v1_2" = ["*.xml"]
