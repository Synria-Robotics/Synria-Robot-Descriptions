[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synriard"
version = "1.2.2"
description = "URDF and MJCF robot description files for Synria robotic platforms."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Synria Robotics", email = "support@synriarobotics.ai"}
]
keywords = ["robotics", "urdf", "mjcf", "robot-description"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "coacd",
    "trimesh",
]

[project.urls]
Homepage = "https://github.com/Synria-Robotics/Synria-robot-descriptions"

[tool.setuptools]
# This automatically finds the 'synriard' folder
packages = ["synriard"] 
include-package-data = false

[tool.setuptools.package-data]
# Keep the published package below PyPI's default 100 MB per-file limit.
# Alicia_M_v1_0, Bessica_D_v1_0, Bessica_D_v1_1, and Bessica_M_v1_0 remain in the repo,
# but are intentionally not included in release artifacts.
synriard = [
    "urdf/__init__.py",
    "urdf/Alicia_D_v5_5/**/*",
    "urdf/Alicia_D_v5_6/**/*",
    "urdf/Alicia_M_v1_1/**/*",
    "meshes/Alicia_D_v5_5/**/*",
    "meshes/Alicia_D_v5_6/**/*",
    "meshes/Alicia_M_v1_1/**/*",
    "mjcf/__init__.py",
    "mjcf/Alicia_D_v5_6/**/*",
    "mjcf/Alicia_M_v1_1/**/*",
]
